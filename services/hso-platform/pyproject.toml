[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hso-control-plane"
version = "0.1.0"
description = "Governed modular-monolith control plane for Hypersystem Orchestrator"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "pydantic==2.14.4",
  "PyJWT[crypto]==2.15.1",
  "mcp==2.3.0",
  "prometheus-client==0.24.1",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
