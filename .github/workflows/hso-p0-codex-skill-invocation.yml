name: P0 Codex CLI SKILL ANALYZER invocation pilot

on:
  workflow_dispatch:
    inputs:
      approve_paid_call:
        description: "I approve one billable Codex CLI inference for the synthetic SKILL ANALYZER pilot."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hso-p0-skill-analyzer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invoke-one-pinned-skill:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'hsaidno-cpu' && inputs.approve_paid_call == true && github.run_attempt == 1 }}
    environment: codex-p0-live
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out parent repository without persisted credentials
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for the pinned Codex CLI package
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Codex CLI and contract dependencies
        run: |
          npm install --global @openai/codex@0.171.0
          python -m pip install -r requirements-test.txt

      - name: Initialize only the approved SKILL ANALYZER source pin
        run: |
          git submodule update --init --depth 1 plugins/skill-analyzer
          python - <<'PY'
          import subprocess
          expected = "c469af7977c9bf6dcb3f5ab7b085a6de20d87004"
          actual = subprocess.check_output(
              ["git", "-C", "plugins/skill-analyzer", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          if actual != expected:
              raise SystemExit(f"SKILL ANALYZER source pin mismatch: {actual}")
          print(f"Verified SKILL ANALYZER source pin: {actual}")
          PY

      - name: Run zero-inference Codex host preflight
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          python tools/hso_super_orchestrator.py discover --output /tmp/hso-p0-capabilities.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/hso-p0-capabilities.json").read_text())
          item = next(x for x in result["capabilities"]
                      if x["capability_id"] == "plugin.skill.invoke.codex.skill-analyzer")
          print(json.dumps({
              "capability_id": item["capability_id"],
              "status": item["status"],
              "evidence": item["evidence"],
              "billable_inference_performed": item.get("probe_details", {}).get("billable_inference_performed")
          }, indent=2))
          if item["status"] != "READY_WITH_LIMITATIONS":
              raise SystemExit("P0 Codex CLI host preflight did not reach READY_WITH_LIMITATIONS")
          PY

      - name: Issue one five-minute scope-bound approval receipt
        env:
          HSO_APPROVAL_HMAC_KEY: ${{ secrets.HSO_APPROVAL_HMAC_KEY }}
        run: |
          python tools/issue_p0_skill_approval.py --output /tmp/hso-p0-approval.json

      - name: Prepare the fixed single-package invocation request
        run: |
          python tools/prepare_p0_skill_workflow.py \
            --approval-receipt /tmp/hso-p0-approval.json \
            --output /tmp/hso-p0-workflow.json

      - name: Invoke SKILL ANALYZER once through Codex CLI
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          HSO_APPROVAL_HMAC_KEY: ${{ secrets.HSO_APPROVAL_HMAC_KEY }}
        run: |
          python tools/hso_super_orchestrator.py run /tmp/hso-p0-workflow.json \
            --workspace "$GITHUB_WORKSPACE" \
            --ledger /tmp/hso-p0-ledger.sqlite \
            --audit /tmp/hso-p0-audit.jsonl \
            --receipt /tmp/hso-p0-run-receipt.json

      - name: Verify audit chain and final invocation receipt
        run: |
          python tools/hso_super_orchestrator.py verify-audit /tmp/hso-p0-audit.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          run = json.loads(Path("/tmp/hso-p0-run-receipt.json").read_text())
          package = run["package_outcomes"]["WP-P0-SKILL-ANALYZER-INVOKE"]
          artifact = json.loads(Path("artifacts/p0-skill-analyzer-invocation.json").read_text())
          invocation = artifact["invocation_receipt"]
          assert run["status"] == "SUCCEEDED", run["status"]
          assert package["status"] == "SUCCEEDED", package["status"]
          assert package["verification"]["verified"] is True
          assert invocation["host"] == "openai-codex-cli-exec"
          assert invocation["plugin"]["source_commit"] == "c469af7977c9bf6dcb3f5ab7b085a6de20d87004"
          assert invocation["model"] == "gpt-6.2-sol"
          assert invocation["acceptance"]["output_schema_valid"] is True
          assert run["audit"]["hash_chain_valid"] is True
          print(json.dumps({
              "status": run["status"],
              "host": invocation["host"],
              "model": invocation["model"],
              "source_commit": invocation["plugin"]["source_commit"],
              "thread_id": invocation["session"]["thread_id"],
              "turn_id": invocation["session"]["turn_id"],
              "token_usage": invocation.get("usage", {}),
              "target_sha256": package["verification"]["sha256"],
              "audit_hash_chain_valid": run["audit"]["hash_chain_valid"]
          }, indent=2))
          PY

      - name: Preserve P0 invocation and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hso-p0-skill-analyzer-${{ github.run_id }}
          path: |
            /tmp/hso-p0-capabilities.json
            /tmp/hso-p0-ledger.sqlite
            /tmp/hso-p0-audit.jsonl
            /tmp/hso-p0-run-receipt.json
            artifacts/p0-skill-analyzer-invocation.json
          if-no-files-found: error
          retention-days: 30
