name: HSO and PRE federation Edge Function CI

on:
  pull_request:
    paths:
      - "supabase/functions/pre-core-federation/**"
      - "supabase/functions/hso-github-webhook/**"
      - "supabase/functions/hso-reconcile/**"
      - "supabase/functions/hso-notion-webhook/**"
      - "supabase/functions/hso-decision-engine/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/*pre_release_private_artifact_bucket*"
      - ".github/workflows/pre-federation-edge-ci.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/pre-core-federation/**"
      - "supabase/migrations/*pre_release_private_artifact_bucket*"
      - ".github/workflows/pre-federation-edge-ci.yml"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out HSO
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Type-check PRE federation and HSO Mission Control Edge Functions
        run: |
          deno check supabase/functions/_shared/github_oidc.ts
          deno check supabase/functions/pre-core-federation/index.ts
          deno check supabase/functions/hso-github-webhook/index.ts
          deno check supabase/functions/hso-reconcile/index.ts
          deno check supabase/functions/hso-notion-webhook/index.ts
          deno check supabase/functions/hso-decision-engine/index.ts
