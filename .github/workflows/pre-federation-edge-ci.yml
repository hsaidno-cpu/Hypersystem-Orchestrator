name: PRE federation Edge Function CI

on:
  pull_request:
    paths:
      - "supabase/functions/pre-core-federation/**"
      - "supabase/migrations/*pre_release_private_artifact_bucket*"
      - ".github/workflows/pre-federation-edge-ci.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/pre-core-federation/**"
      - "supabase/migrations/*pre_release_private_artifact_bucket*"
      - ".github/workflows/pre-federation-edge-ci.yml"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out HSO
        uses: actions/checkout@11bd7194e4cbbf3b3c0d8c0a7440f8f2d0e4f24a
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Type-check federation Edge Function
        run: deno check supabase/functions/pre-core-federation/index.ts
