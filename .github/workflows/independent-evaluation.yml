name: HSO Independent Evaluation Runtime

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-evaluation:
    name: Read-only independent candidate evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out frozen candidate commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute independent evaluation on the frozen SDO dossier
        run: >-
          python tools/independent_evaluation_gate.py evaluate
          examples/sdo-independent-evaluation.input.json
          --output "$RUNNER_TEMP/sdo-independent-evaluation.json"

      - name: Verify report integrity and expected current HOLD disposition
        run: |
          python tools/independent_evaluation_gate.py verify "$RUNNER_TEMP/sdo-independent-evaluation.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"], "sdo-independent-evaluation.json").read_text())
          assert report["disposition"] == "HOLD", report["disposition"]
          assert report["candidate"]["candidate_id"] == "SDO-PLUGIN-0.1.0-20261126"
          assert report["evaluator"]["read_only"] is True
          assert report["evaluator"]["identity_separated"] is True
          assert report["integrity"]["candidate_mutated"] is False
          print(json.dumps({
              "evaluation_id": report["evaluation_id"],
              "candidate": report["candidate"]["candidate_id"],
              "disposition": report["disposition"],
              "score_percent": report["score"]["percent"],
              "evaluator": report["evaluator"]["identity"],
              "read_only": report["evaluator"]["read_only"],
              "candidate_mutated": report["integrity"]["candidate_mutated"]
          }, indent=2))
          PY

      - name: Preserve independent evaluation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hso-independent-evaluation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sdo-independent-evaluation.json
            ${{ runner.temp }}/sdo-independent-evaluation.json.sha256
          if-no-files-found: error
          retention-days: 30
