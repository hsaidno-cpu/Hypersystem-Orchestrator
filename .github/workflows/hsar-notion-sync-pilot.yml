name: HSAR GitHub to Notion Sync Pilot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read GitHub and calculate hashes without writing to Notion"
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: hsar-notion-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python v6.3.0
        with:
          python-version: "3.12"

      - name: Run local synchronization contract tests
        run: python -m unittest discover -s tests -v

      - name: Run manual dry-run (no Notion credential is read)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HSAR_ALLOWED_REPOSITORIES: hsaidno-cpu/Hypersystem-Orchestrator
        run: python scripts/hsar_notion_sync.py --dry-run

      - name: Run idempotent Notion upsert
        if: >-
          ${{
            vars.HSAR_NOTION_SYNC_ENABLED == 'true' &&
            (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) &&
            (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_HSAR_CHANGE_DATA_SOURCE_ID: ${{ vars.NOTION_HSAR_CHANGE_DATA_SOURCE_ID }}
          HSAR_NOTION_SYNC_ENABLED: ${{ vars.HSAR_NOTION_SYNC_ENABLED }}
          HSAR_ALLOWED_REPOSITORIES: hsaidno-cpu/Hypersystem-Orchestrator
        run: python scripts/hsar_notion_sync.py

      - name: Report disabled write gate
        if: ${{ vars.HSAR_NOTION_SYNC_ENABLED != 'true' }}
        run: echo "HSAR Notion write gate is disabled. Contract tests completed; no Notion write attempted."
