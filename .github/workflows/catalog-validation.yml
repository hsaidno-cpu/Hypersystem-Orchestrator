name: Catalog and distribution validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out parent repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract-test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Validate plugin catalog and source declarations
        run: python tools/validate_catalog.py
      - name: Validate distribution eligibility and platform registry
        run: python tools/validate_distribution.py
      - name: Validate plan-only workflow example
        run: python tools/plan_hso_workflow.py examples/hso-workflow-plan.example.json --output /tmp/hso-workflow-plan.json
      - name: Run unit and resolver tests
        run: python -m unittest discover -s tests -v
      - name: Probe real sandbox capabilities
        run: python tools/hso_super_orchestrator.py discover --output /tmp/hso-capability-receipt.json
      - name: Execute dependency-ordered sandbox workflow
        run: >-
          python tools/hso_super_orchestrator.py run examples/hso-runtime-execution.example.json
          --workspace /tmp/hso-runtime-target
          --ledger /tmp/hso-runtime-ledger.sqlite
          --audit /tmp/hso-runtime-audit.jsonl
          --receipt /tmp/hso-runtime-receipt.json
      - name: Verify sandbox execution audit
        run: python tools/hso_super_orchestrator.py verify-audit /tmp/hso-runtime-audit.jsonl
      - name: Execute retry and recovery fault-injection workflow
        env:
          HSO_ENABLE_TEST_ADAPTERS: "1"
        run: >-
          python tools/hso_super_orchestrator.py run examples/hso-runtime-recovery.example.json
          --workspace /tmp/hso-recovery-target
          --ledger /tmp/hso-recovery-ledger.sqlite
          --audit /tmp/hso-recovery-audit.jsonl
          --receipt /tmp/hso-recovery-receipt.json
      - name: Verify recovery audit
        run: python tools/hso_super_orchestrator.py verify-audit /tmp/hso-recovery-audit.jsonl
      - name: Preserve runtime receipts and target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hso-super-orchestrator-runtime-${{ github.sha }}
          path: |
            /tmp/hso-capability-receipt.json
            /tmp/hso-runtime-target
            /tmp/hso-runtime-ledger.sqlite
            /tmp/hso-runtime-audit.jsonl
            /tmp/hso-runtime-receipt.json
            /tmp/hso-recovery-target
            /tmp/hso-recovery-ledger.sqlite
            /tmp/hso-recovery-audit.jsonl
            /tmp/hso-recovery-receipt.json
          retention-days: 30
