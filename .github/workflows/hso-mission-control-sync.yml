name: HSO Mission Control synchronization

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_run:
    workflows: ["Catalog and distribution validation"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write

concurrency:
  group: hso-mission-control-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  event-ingestion:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target never checks out or executes the PR head. All code is
      # taken from trusted main; the event payload is treated as untrusted data.
      - name: Check out trusted HSO main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Emit GitHub event using short-lived OIDC
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: python tools/emit_hso_oidc_event.py event

  scheduled-reconciliation:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted HSO main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Reconcile authoritative sources using short-lived OIDC
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python tools/emit_hso_oidc_event.py reconcile
