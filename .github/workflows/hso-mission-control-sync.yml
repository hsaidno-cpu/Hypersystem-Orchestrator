name: HSO Mission Control synchronization

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_run:
    workflows: ["Catalog and distribution validation"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: hso-mission-control-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  event-ingestion:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out HSO
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Emit signed event to HSO
        env:
          HSO_SYNC_URL: ${{ vars.HSO_GITHUB_WEBHOOK_URL }}
          HSO_SYNC_TOKEN: ${{ secrets.HSO_SYNC_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "$HSO_SYNC_URL" ] || [ -z "$HSO_SYNC_TOKEN" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::notice::HSO publisher not invoked for non-main validation event."
              echo "PR/feature-branch validation only; no production sync was attempted." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::HSO integration NOT_CONFIGURED on main. Set HSO_GITHUB_WEBHOOK_URL and HSO_SYNC_TOKEN before production event delivery."
            echo "FAILED: main-branch event was not delivered because publisher credentials are missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python tools/emit_hso_sync_event.py --mode event

  scheduled-reconciliation:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out HSO
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reconcile authoritative sources
        env:
          HSO_SYNC_URL: ${{ vars.HSO_GITHUB_WEBHOOK_URL }}
          HSO_SYNC_TOKEN: ${{ secrets.HSO_SYNC_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$HSO_SYNC_URL" ] || [ -z "$HSO_SYNC_TOKEN" ]; then
            echo "::error::HSO reconciliation NOT_CONFIGURED. Set HSO_GITHUB_WEBHOOK_URL and HSO_SYNC_TOKEN before enabling scheduled sync."
            echo "FAILED: scheduled/manual reconciliation did not run because publisher credentials are missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python tools/emit_hso_sync_event.py --mode reconcile
