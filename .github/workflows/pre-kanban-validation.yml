name: PRE Kanban backend validation

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/pre-kanban-mcp/**"
      - "supabase/migrations/*_pre_kanban_*.sql"
      - "apps/pre-kanban/**"
      - "tests/test_pre_kanban_contract.py"
      - "tests/pre-kanban-postgres-smoke.sql"
      - ".github/workflows/pre-kanban-validation.yml"
  push:
    branches: [main, "feat/pre-kanban-mcp-backend-20261128"]
    paths:
      - "supabase/functions/pre-kanban-mcp/**"
      - "supabase/migrations/*_pre_kanban_*.sql"
      - "apps/pre-kanban/**"
      - "tests/test_pre_kanban_contract.py"
      - "tests/pre-kanban-postgres-smoke.sql"
      - ".github/workflows/pre-kanban-validation.yml"

permissions:
  contents: read

concurrency:
  group: pre-kanban-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mcp-edge-function:
    name: Type-check PRE Kanban MCP Edge Function
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Function and SDK imports
        working-directory: supabase/functions/pre-kanban-mcp
        run: deno check --config deno.json index.ts

  frontend:
    name: Build PRE Kanban frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pre-kanban
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/pre-kanban/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Record exact resolved frontend dependencies
        run: npm ls --depth=0 --json > dependency-tree.json

      - name: Preserve generated npm lockfile for repository review
        uses: actions/upload-artifact@v4
        with:
          name: pre-kanban-ui-dependency-lock
          path: |
            apps/pre-kanban/package-lock.json
            apps/pre-kanban/dependency-tree.json
          if-no-files-found: error
          retention-days: 7

  contract-tests:
    name: Verify PRE Kanban contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PRE Kanban contract tests
        run: python -m unittest discover -s tests -p "test_pre_kanban_contract.py" -v


  postgres-migrations:
    name: Apply Kanban migrations to disposable PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: kanban-ci-password
          POSTGRES_DB: kanban_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kanban_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:kanban-ci-password@localhost:5432/kanban_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Bootstrap minimal Supabase Auth roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create table auth.users (id uuid primary key);
          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;
          grant usage on schema auth to authenticated;
          grant execute on function auth.uid() to anon, authenticated;
          SQL

      - name: Apply all six PRE Kanban migrations in order
        run: |
          migration_count=$(find supabase/migrations -maxdepth 1 -type f -name '20261128*_pre_kanban_*.sql' | wc -l | tr -d ' ')
          if [ "$migration_count" -ne 6 ]; then
            echo "Expected exactly six PRE Kanban migrations; found $migration_count"
            exit 1
          fi
          while IFS= read -r migration; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '20261128*_pre_kanban_*.sql' | sort)

      - name: Verify schema, RLS, RPC signatures and restricted grants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/pre-kanban-postgres-smoke.sql
